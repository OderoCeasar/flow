server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://api:8081;
    }

    # Signed photo URLs point at this origin. The Host header is passed through
    # unchanged because it is part of the S3 signature.
    location /flow-photos/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    # Fingerprinted build output never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and HTML must always be revalidated so updates land.
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
